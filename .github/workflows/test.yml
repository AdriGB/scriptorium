name: Tests

on:
  push:
    branches: [main]
  pull_request:

# La suite no toca la red ni escribe nada: son asserts sobre modulos importados
# de verdad y sobre el codigo como texto. Corre en ~1s, asi que no hace falta
# cache de dependencias.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # v5 (runtime Node 24): con v4 el runner avisaba de que Node 20 esta
      # deprecado y lo forzaba a Node 24. Hoy funciona igual, pero no hace falta
      # esperar a que deje de hacerlo.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm ci

      - name: Tests de comportamiento
        run: node ./tests/regression.mjs

      - name: Tests estructurales
        run: node ./tests/structure.mjs

      # El grafo de modulos: si un import apunta a un fichero que no existe,
      # los tests unitarios no se enteran porque solo importan modulos sueltos.
      - name: El bundle resuelve
        run: npx esbuild ./js/app.js --bundle --format=esm --outfile=/tmp/check.js
